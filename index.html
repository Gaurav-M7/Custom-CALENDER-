<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>PlanIt</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Status Bar Spacer -->
  <div class="status-bar-spacer"></div>

  <!-- App Header -->
  <header class="app-header">
    <div class="header-inner">
      <div class="header-left">
        <span class="app-title">PlanIt</span>
      </div>
      <div class="header-right">
        <div class="header-avatar">YO</div>
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main id="app-content">

    <!-- HOME TAB -->
    <section id="tab-home" class="tab-panel active">

      <div class="greeting-block">
        <p class="greeting-sub">Good morning ☀️</p>
        <h2 class="greeting-date" id="home-today-date">Today</h2>
      </div>

      <!-- Today Summary Card -->
      <div class="glass-card today-summary-card">
        <div class="today-card-header">
          <div>
            <div class="label-pill">TODAY</div>
            <p class="today-task-count" id="today-task-count">0 tasks</p>
          </div>
          <div class="today-icon-wrap">📋</div>
        </div>
        <div id="home-today-tasks" class="task-list">
          <p class="empty-msg">Nothing scheduled — enjoy your day!</p>
        </div>
      </div>

      <!-- Upcoming Section -->
      <div class="section-header">
        <span class="section-title">Upcoming</span>
        <span class="section-badge" id="upcoming-badge">Next 7 days</span>
      </div>
      <div id="home-upcoming-tasks"></div>

    </section>

    <!-- DATES (CALENDAR) TAB -->
    <section id="tab-dates" class="tab-panel">

      <div class="section-header" style="margin-top:8px">
        <span class="section-title" id="calendar-month-year">Month Year</span>
        <div class="cal-nav-btns">
          <button id="prev-month" class="cal-nav-btn">‹</button>
          <button id="next-month" class="cal-nav-btn">›</button>
        </div>
      </div>

      <div class="glass-card calendar-container">
        <div class="calendar-weekdays">
          <div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div>
        </div>
        <div id="calendar-days" class="calendar-days"></div>
      </div>

      <!-- Task Creator Form for Selected Date -->
      <div class="glass-card task-form-box">
        <h3 id="selected-date-label" class="selected-date-label">Select a date</h3>
        <div id="add-task-form" class="add-task-form hidden">
          <input type="text" id="task-input" placeholder="Add a task…" autocomplete="off">
          <button type="button" id="add-task-btn" class="add-btn">
            <span>+</span>
          </button>
        </div>
        <div id="selected-date-tasks" class="task-list"></div>
      </div>

    </section>

    <!-- TODO TAB -->
    <section id="tab-todos" class="tab-panel">
      <div class="section-header" style="margin-top:8px">
        <span class="section-title">All Tasks</span>
        <span class="section-badge" id="all-tasks-count">0</span>
      </div>
      <div class="glass-card">
        <div id="all-todos-list" class="task-list">
          <p class="empty-msg">Your list is pristine ✨</p>
        </div>
      </div>
    </section>

  </main>

  <!-- Bottom Navigation Bar -->
  <nav class="nav-bar">
    <button class="nav-btn active" data-tab="home">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span class="label">Home</span>
    </button>
    <button class="nav-btn" data-tab="dates">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span class="label">Calendar</span>
    </button>
    <button class="nav-btn" data-tab="todos">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      <span class="label">All Tasks</span>
    </button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
